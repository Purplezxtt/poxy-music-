<style>
/* Layout: título grande em serifa, álbuns em grade de 2 colunas, barra inferior com botão + central, telas de ajustes em lista. */

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;

  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f5f8; --surface: #ffffff; --tile: #e7e5ec; --fg: #17161b; --muted: #6a6772; --line: #dcd9e3;
  --accent: #7a3fd1; --accent-fg: #ffffff; --accent-soft: #e9ddfa; --danger: #c43a3a; --ok: #1f8a5a;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 140px; -webkit-tap-highlight-color: transparent;
}

img { max-width: 100%; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { display: flex; align-items: center; gap: 4px; min-height: 64px; }

.ibtn:hover { background: var(--surface); color: var(--fg); }

#tools { padding-bottom: 8px; }
.searchwrap { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; color: var(--muted); }

main { padding-top: 8px; }

.aname { margin-top: 8px; font-family: var(--font-display); font-weight: 500; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.day { margin-top: 20px; }

.cell:hover .check, .cell:focus-visible .check, body.selecting .check { opacity: 1; }
@media (hover: none) { .check { opacity: .85; } }
.cell[aria-selected="true"] .check { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); opacity: 1; }
.filetile { height: 100%; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; background: var(--surface); }
.ext { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; color: var(--accent); letter-spacing: 0.04em; }

.empty h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0; text-wrap: balance; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 600; min-height: 44px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--bg); border-color: var(--danger); }
.btn.block { width: 100%; }

.card + .card, .card + .cols, .cols + .card { margin-top: 12px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.mini { text-align: left; display: grid; gap: 10px; font-family: var(--font-display); font-size: 1.05rem; }
.mini .n { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-family: var(--font-body); font-size: 1.05rem; }
.alertcard { display: flex; gap: 12px; align-items: center; }
.alertcard .bubble { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--danger); color: #fff; }
.alertcard .bubble.ok { background: var(--ok); color: #06210f; }
.alertcard h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.1rem; }
.warnbox { margin-top: 12px; background: color-mix(in srgb, var(--danger) 16%, var(--bg)); border-radius: 10px; padding: 12px; text-align: center; }
.btnrow { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.btnrow .btn { flex: 1 1 140px; }
.rows { margin-top: 16px; display: grid; }
.row { display: flex; align-items: center; gap: 16px; width: 100%; padding: 14px 4px; border: 0; background: none; text-align: left; font-size: 1rem; }
.row .ic { color: var(--muted); }
.row .grow { flex: 1; min-width: 0; }
.row .sub { display: block; color: var(--muted); font-size: 0.82rem; }
.row.static { cursor: default; }
.section { margin-top: 20px; }
.section h3 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 500; font-size: 1rem; }
.note { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; }
.switch { flex: none; width: 50px; height: 30px; border-radius: 999px; border: 0; background: var(--tile); position: relative; padding: 0; }
.switch i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.switch[aria-checked="true"] { background: var(--accent-soft); }
.switch[aria-checked="true"] i { transform: translateX(20px); background: var(--accent); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.seg button { flex: 1 1 auto; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 9px 12px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 600; }
.seg button:disabled { opacity: .45; cursor: default; }
.swatches { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; padding: 0; display: grid; place-items: center; color: #000; }
.swatch[aria-pressed="true"] { border-color: var(--fg); }
.hint { display: flex; gap: 12px; align-items: center; background: var(--accent-soft); border-radius: 16px; padding: 12px 14px; margin-top: 8px; }
.hint .grow { flex: 1; min-width: 0; }
.hint b { font-family: var(--font-display); font-weight: 500; }
.list { margin-top: 8px; display: grid; gap: 8px; }
.li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.prose p { margin: 0 0 12px; color: var(--fg); }
.prose h3 { margin: 20px 0 6px; font-family: var(--font-display); font-weight: 500; }

.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: calc(64px + env(safe-area-inset-bottom, 0px)); padding: 0 max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
.nb { width: 72px; height: 48px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; border-radius: 12px; }
.nb:hover { color: var(--fg); }
.fab { position: absolute; left: 50%; top: -28px; transform: translateX(-50%); width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.35); }

.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); display: grid; align-items: end; justify-items: center; }
.overlay.mid { align-items: center; padding: 16px; }
.sheetcard { width: min(520px, 100%); background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.dlgcard { width: min(420px, 100%); background: var(--surface); border-radius: 20px; padding: 20px; display: grid; gap: 12px; max-height: 90vh; overflow: auto; }
.sheetcard h2, .dlgcard h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.2rem; }
.dlgcard p { margin: 0; color: var(--muted); white-space: pre-line; }
.field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.lbl { font-size: 0.82rem; color: var(--muted); }
.dlgbtns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.choices { display: grid; gap: 8px; }
.err { color: var(--danger); font-size: 0.85rem; min-height: 1em; }
.srcs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.src { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 14px 4px; display: grid; justify-items: center; gap: 6px; font-size: 0.8rem; color: var(--fg); }
.src .ic { color: var(--accent); }
#menuwrap { position: fixed; inset: 0; z-index: 55; }
#menu { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 58px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 240px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
#menu button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 12px; border: 0; background: none; text-align: left; border-radius: 10px; }
#menu button:hover { background: var(--tile); }
#menu .ic { color: var(--muted); }

#toast { position: fixed; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 70; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
#toast .msg { pointer-events: auto; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 11px 14px; max-width: 520px; display: flex; gap: 14px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
#toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
#drop { position: fixed; inset: 0; z-index: 65; background: color-mix(in srgb, var(--bg) 88%, transparent); display: grid; place-items: center; font-family: var(--font-display); font-size: 1.4rem; border: 3px dashed var(--accent); margin: 10px; border-radius: 16px; pointer-events: none; }
#shade { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; color: var(--accent); }

.full { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; overflow: auto; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#pinmodal { z-index: 80; }
#lock { z-index: 90; }
.pin { width: min(340px, 100%); padding: 24px 16px; text-align: center; display: grid; gap: 10px; }
.pin h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.4rem; }
.pin p { margin: 0; }
.pinlogo { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 6px; }
.dots { display: flex; gap: 14px; justify-content: center; margin: 14px 0 4px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
.dots i.on { background: var(--accent); border-color: var(--accent); }
.dots.bad i { border-color: var(--danger); }
.pin .msg { min-height: 1.4em; color: var(--danger); font-size: 0.9rem; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; justify-items: center; margin-top: 6px; }
.key { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--surface); font-family: var(--font-display); font-size: 1.6rem; display: grid; place-items: center; }

.cdisp.small { font-size: 2.2rem; }
.ckeys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

.vbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; }
.vtitle { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }
.vbar .ibtn { color: var(--viewer-fg); }
.vbar .ibtn:hover { background: rgba(255,255,255,.12); }

.vstage .filecard .btn { background: transparent; color: var(--viewer-fg); }

.vnav.prev { left: 4px; } .vnav.next { right: 4px; }
.vnav:disabled { opacity: .25; cursor: default; }

@media (prefers-reduced-motion: no-preference) { .cell img, .cell video { transition: transform .15s; } .dots.bad { animation: shake .25s; } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

</style>
</head>
<body>

<div id="app">
  <header id="head">
    <div class="bar" id="bar"></div>
    <div id="tools" hidden>
      <div class="searchwrap"><span id="searchic"></span><input id="q" type="search" placeholder="Buscar pelo nome" aria-label="Buscar pelo nome"></div>
      <div class="chips" id="chips" role="group" aria-label="Filtros">
        <button class="chip" type="button" data-f="all" aria-pressed="true">Tudo</button>
        <button class="chip" type="button" data-f="image" aria-pressed="false">Fotos</button>
        <button class="chip" type="button" data-f="video" aria-pressed="false">Vídeos</button>
        <button class="chip" type="button" data-f="file" aria-pressed="false">Arquivos</button>
        <button class="chip" type="button" data-f="fav" aria-pressed="false">Favoritos</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav class="bottombar" id="bottom" hidden></nav>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-label="Visualizador">

  <div class="vstage" id="vstage">
    <button class="vnav prev" id="vprev" type="button" data-act="v-prev" aria-label="Anterior"></button>
    <button class="vnav next" id="vnext" type="button" data-act="v-next" aria-label="Próximo"></button>
  </div>
  <div class="vmeta" id="vmeta"></div>
</div>

<div id="menuwrap" hidden><div id="menu" role="menu"></div></div>

<div class="overlay mid" id="dialog" hidden><div class="dlgcard" id="dlgcard" role="dialog" aria-modal="true"></div></div>

<div class="full" id="pinmodal" hidden></div>
<div class="full" id="lock" hidden></div>
<div id="shade" hidden></div>

<input id="fGallery" type="file" multiple hidden accept="image/*,video/*">
<input id="fPhoto" type="file" hidden accept="image/*" capture="environment">
<input id="fVideo" type="file" hidden accept="video/*" capture="environment">
<input id="fFiles" type="file" multiple hidden>
<input id="fRestore" type="file" hidden accept=".zip,application/zip">

<script>

}

  const upd = () => { const d = $('#cdisp'); d.textContent = (ce || '0').replace(/\./g, ','); d.classList.toggle('small', ce.length > 9); };

    const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k;

      try { const v = evalExpr(ce || '0'); ce = isFinite(v) ? String(parseFloat(v.toFixed(10))) : 'Erro'; } catch (x) { ce = 'Erro'; }

}
async function destroyItems(ids) {

}
async function restoreItems(ids) {

/* ---------- envio ---------- */
async function uploadFiles(list, albumId) {
  const files = Array.from(list), errs = []; let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    toast(`Salvando ${i + 1} de ${files.length}…`, null, null, true);
    if (!f.size) { errs.push(`${f.name}: arquivo vazio`); continue; }
    if (f.size > MAX_BYTES) { errs.push(`${f.name}: passa de ${fmtBytes(MAX_BYTES)}`); continue; }
    const it = { id: newId(), name: f.name || 'arquivo', kind: kindFor(f), mime: f.type || 'application/octet-stream', size: f.size, takenAt: f.lastModified || Date.now(), addedAt: Date.now(), fav: false, albumId, blob: f };
    try { await saveItem(it); items.push(it); ok++; }
    catch (e) { errs.push(`${f.name}: ${e && e.name === 'QuotaExceededError' ? 'o armazenamento do navegador está cheio' : 'não foi possível salvar'}`); }
  }
  if (ok && navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
  const a = albumById(albumId);
  toast(ok ? `${ok} ${ok === 1 ? 'arquivo salvo' : 'arquivos salvos'} em ${a ? a.name : 'Álbum principal'}` : 'Nada foi salvo');
  paint();
  if (errs.length) dialog({ title: 'Alguns arquivos não foram salvos', text: errs.join('\n'), ok: 'Entendi', cancel: false });
}

/* ---------- backup ---------- */
async function makeBackup() {
  const live = items.filter(i => !i.deletedAt);
  if (!live.length) { toast('Nada para salvar ainda'); return; }
  try {
    toast('Gerando backup…', null, null, true);
    const meta = { app: 'photx', version: 2, createdAt: Date.now(), albums: albums.map(a => Object.assign({}, a)), items: live.map(i => { const r = Object.assign({}, i); delete r.blob; delete r._url; return r; }) };
    const entries = [{ name: 'photx.json', blob: new Blob([JSON.stringify(meta)], { type: 'application/json' }) }].concat(live.map(i => ({ name: 'files/' + i.id, blob: i.blob })));
    const zip = await buildZip(entries);
    const d = new Date(), name = `photx-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.zip`;
    const url = URL.createObjectURL(zip), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    const t = Date.now(); for (const it of live) { it.backedAt = t; await saveItem(it); }
    toast('Backup criado. Guarde o arquivo .zip em outro lugar.'); paint();
  } catch (e) { toast('Não foi possível criar o backup: ' + (e && e.message ? e.message : 'erro')); }
}
async function restoreBackup(file) {
  try {
    toast('Lendo backup…', null, null, true);
    const entries = await readZipEntries(file), map = new Map(entries.map(e => [e.name, e]));
    const mj = map.get('photx.json'); if (!mj || mj.method !== 0) throw new Error('este arquivo não é um backup do Photx');
    const meta = JSON.parse(await (await zipEntryBlob(file, mj, 'application/json')).text());
    if (meta.app !== 'photx') throw new Error('este arquivo não é um backup do Photx');
    for (const a of meta.albums || []) if (!albumById(a.id)) { await dbPut('albums', a); albums.push(a); }
    let n = 0;
    for (const m of meta.items || []) {
      if (byId(m.id)) continue; const e = map.get('files/' + m.id); if (!e || e.method !== 0) continue;
      const it = Object.assign({}, m, { blob: await zipEntryBlob(file, e, m.mime), backedAt: Date.now() }); delete it.deletedAt;
      if (!albumById(it.albumId)) it.albumId = 'main';
      await saveItem(it); items.push(it); n++;
    }
    toast(n ? `${n} ${n === 1 ? 'item restaurado' : 'itens restaurados'}` : 'Nada novo para restaurar'); paint();
  } catch (e) { toast('Não foi possível restaurar: ' + (e && e.message ? e.message : 'erro')); }
}

    case 'set-accent': cfg.accent = v; saveCfg(); applyTheme(); paint(); break;
    case 'persist': { const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; toast(ok ? 'Armazenamento protegido contra limpeza automática' : 'O navegador não concedeu a proteção'); paint(); break; }
    case 'wipe': { const r = await dialog({ title: 'Apagar tudo', text: 'Isso apaga todos os arquivos, álbuns, o PIN e os ajustes deste aparelho. Não dá para desfazer.', ok: 'Apagar tudo', danger: true }); if (!r) break; if (idb) { try { idb.close(); } catch (x) {} } for (const n of ['photx', 'photx-fake']) await new Promise(res => { const q = indexedDB.deleteDatabase(n); q.onsuccess = q.onerror = q.onblocked = res; }); try { localStorage.removeItem(CFG_KEY); } catch (x) {} location.reload(); break; }
  }
});
async function albumPassFlow(a) {
  if (!a.passHash) return setAlbumPassword(a);
  const r = await dialog({ title: a.name, choices: [{ label: 'Alterar senha' }, { label: 'Remover senha', danger: true }] });
  if (!r) return;
  if (r.choice === 0) {
    const ok = await dialog({ title: 'Senha atual', input: { type: 'password', placeholder: 'Senha atual' }, ok: 'Continuar', validate: async v => (await hashSecret(v.value, a.passSalt)) === a.passHash ? null : 'Senha incorreta' });
    if (ok) await setAlbumPassword(a);
  } else await removeAlbumPassword(a);
}
async function toggleLock() {
  if (cfg.lockEnabled && cfg.pinHash) {
    const cur = await verifyCurrentPin(); if (cur == null) return;
    Object.assign(cfg, { lockEnabled: false, pinHash: '', pinSalt: '', calc: false }); saveCfg(); paint(); toast('Bloqueio desligado'); return;
  }
  const p = await createPin({ title: 'Criar PIN', validate: async () => null }); if (p == null) return;
  cfg.pinSalt = newSalt(); cfg.pinHash = await hashSecret(p, cfg.pinSalt); cfg.lockEnabled = true; saveCfg(); paint(); toast('Bloqueio ativado. Anote seu PIN: não há como recuperar.');
}
async function changePin() {
  const cur = await verifyCurrentPin(); if (cur == null) return;
  const p = await createPin({ title: 'Novo PIN', validate: async p => cfg.fakeHash && (await hashSecret(p, cfg.fakeSalt)) === cfg.fakeHash ? 'Use um PIN diferente do PIN falso' : null });
  if (p == null) return;
  cfg.pinSalt = newSalt(); cfg.pinHash = await hashSecret(p, cfg.pinSalt); saveCfg(); toast('PIN alterado');
}
async function fakePin() {
  const p = await createPin({ title: 'PIN do cofre falso', validate: async p => (await hashSecret(p, cfg.pinSalt)) === cfg.pinHash ? 'Use um PIN diferente do PIN real' : null });
  if (p == null) return;
  cfg.fakeSalt = newSalt(); cfg.fakeHash = await hashSecret(p, cfg.fakeSalt); saveCfg(); paint(); toast('Cofre falso pronto');
}
document.addEventListener('keydown', e => {
  if (locked || !$('#pinmodal').hidden || !$('#dialog').hidden) return;
  if (!$('#viewer').hidden) { if (e.key === 'Escape') closeViewer(); else if (e.key === 'ArrowLeft') stepViewer(-1); else if (e.key === 'ArrowRight') stepViewer(1); }
  else if (e.key === 'Escape') { if (!$('#menuwrap').hidden) hideMenu(); else if (!$('#sheet').hidden) $('#sheet').hidden = true; else if (selected.size) { selected.clear(); paint(); } }
});

/* ---------- início ---------- */
async function init() {
  applyTheme();
  $('#searchic').innerHTML = ic('search', 20);
  $('#bottom').innerHTML = `<button class="nb" data-act="nav-menu" aria-label="Meu cofre">${ic('menu')}</button><button class="fab" data-act="nav-add" aria-label="Adicionar">${ic('plus', 30)}</button><button class="nb" data-act="nav-all" aria-label="Todos os itens">${ic('grid')}</button>`;
  history.replaceState(route, '');
  if (!window.indexedDB) { locked = false; setBar({ title: 'Photx', big: true }); $('#main').innerHTML = '<div class="empty"><h2>Armazenamento indisponível</h2><p>Este navegador não permite guardar arquivos. Tente fora da aba anônima.</p></div>'; return; }
  try { if (cfg.lockEnabled && cfg.pinHash) showLock(); else await openVault('real'); }
  catch (e) { locked = false; setBar({ title: 'Photx', big: true }); $('#main').innerHTML = '<div class="empty"><h2>Não foi possível abrir o cofre</h2><p>O navegador bloqueou o armazenamento. Tente fora da aba anônima.</p></div>'; }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
init();
})();
</script>
